[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn-lab"
version = "1.0.0"
description = "SQL-first churn modeling, calibrated risk and retention campaign planning"
authors = [{name = "Ainur Ali"}]
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.scripts]
churn-lab = "churn_lab.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
